# .vaulty.yml — place at the vault root. Every key is optional; the values
# below are the built-in defaults (default vault layout). See DESIGN.md §4.
version: 1

# Content dirs, relative to the root. Vault-wide scans and page-name
# resolution only look here. Missing dirs are skipped.
dirs: [wiki, me, now, archive]

# Globs never scanned ("dir/**" = everything below dir; else path.Match).
exclude: []

frontmatter:
  updated_key: updated          # bumped by --touch (`timeline append`, `write`, `frontmatter`)

timeline:
  heading: "## Timeline"        # exact heading line
  divider: "---"                # line directly above the heading (blank lines allowed between)
  entry_gap: auto               # blank lines between entries on append: auto | 0 | 1

lint:
  hook_paths: ["wiki/**"]       # files `vaulty lint --hook` checks
  page_checks:
    paths: ["wiki/**"]          # where PG001/PG002 apply
    compiled_truth_max_tokens: 3000   # estimate = ceil(bytes/4) above the divider
    checklist: true             # "- [ ]" / "- [x]" above the divider = work material
    table_keywords: [unit, units, step, steps, stap, stappen]  # table header cell first word
    heading_keywords: ["agent log"]  # heading text prefix (case-insensitive)
  severity: {}                  # per-code override, e.g. {TL006: error, TL008: off}
  baseline_path: .vaulty-baseline.json  # ratchet file (§6.1a); write/update via `lint --write-baseline`
  overrides: []                 # per-path severity/ratchet exemptions (§6.1a); example:
  # overrides:
  #   - paths: ["now/tracking/**"]     # a work-log layer, not compiled knowledge
  #     ratchet:
  #       TL006: false                 # never baselined; stays a plain warning forever
  #       TL008: false
  shard:
    type_dirs: ["wiki/*"]       # SH001-SH005 (§16); a dir is a hub-directory candidate
                                 # when its parent matches one of these. [] disables SH*.

log:
  path: log.md                  # `vaulty log append|last|lint` target, relative to the root

fields:                         # shared by find and search (DESIGN.md §4.1, §18, §19)
  type: type                    # frontmatter key holding the page type (--type, facets)
  title: title                  # frontmatter key holding the page title (title-display fallback)

find:
  index: index.md               # vault-relative path `find` reads index summaries from;
                                 # a missing file is skipped silently
  # `find`'s --only <dir|glob> (repeatable/comma-separated) has no config
  # key — it's a per-invocation narrowing (e.g. --only wiki, --only now/actions),
  # not a vault-wide setting. The vault-wide "never scan" list stays the
  # top-level `exclude` above; a vault with a working/archive layer that
  # should default OUT of `find` results entirely would list it there, e.g.
  # exclude: [archive/**, now/tracking/**, now/actions/**]
  fields:                       # scoring sources (DESIGN.md §18.2), in tie-break order.
                                 # Replaces this whole list when given — not merged.
    - { source: slug,        weight: 100, match: token }  # exact slug match keeps a bonus (weight/2 on a mere substring)
    - { source: frontmatter, key: title,   weight: 40, match: token }
    - { source: frontmatter, key: aliases, weight: 40, match: token }
    - { source: frontmatter, key: tags,    weight: 25, match: token }
    - { source: index,       weight: 20, match: token }
    - { source: h1,          weight: 20, match: token }
    - { source: body,        weight: 5,  match: token }   # --body only, last-resort fallback
  # A vault-specific frontmatter key can be added, e.g. an id matched whole
  # (no tokenizing, so a "/" in it survives):
  # fields:
  #   - { source: slug, weight: 100, match: token }
  #   - { source: frontmatter, key: id, weight: 60, match: exact }
  #   - { source: frontmatter, key: title, weight: 40, match: token }

search:
  analyzers: [standard]         # analyzers text is indexed with, one sub-field each (DESIGN.md §19.2);
                                 # standard = language-neutral, no stemming. A stemmed-language vault
                                 # lists language codes instead, e.g. [nl, en] for Dutch + English.
                                 # The index cache lives outside the vault: $VAULTY_CACHE_DIR, else
                                 # the user cache dir (DESIGN.md §19.3).
  boosts:                       # query-time weight per content field (DESIGN.md §19.2); merges onto
                                 # these defaults — a partial override only changes the keys it names.
    title: 5.0
    aliases: 5.0
    slug: 5.0
    h1: 3.0
    index: 3.0
    tags: 2.0
    body: 1.0
  field_aliases: { tag: tags }  # query-string `key:value` field name -> frontmatter key; merges too
